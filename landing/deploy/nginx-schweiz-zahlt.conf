server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sozialgeld-ch.com www.sozialgeld-ch.com;

    ssl_certificate /etc/letsencrypt/live/sozialgeld-ch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sozialgeld-ch.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/schweiz-zahlt;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5050/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin {
        proxy_pass http://127.0.0.1:5050/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|webp|png|jpg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.pdf$ {
        add_header Content-Disposition "attachment";
        expires 1d;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name sozialgeld-ch.com www.sozialgeld-ch.com;

    return 301 https://sozialgeld-ch.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name 162.35.229.181;

    return 301 https://sozialgeld-ch.com$request_uri;
}
