<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – Schweiz zahlt</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body class="admin-body admin-body--center">
  <div class="admin-card admin-card--narrow">
    <h1 class="admin-title">🇨🇭 Admin</h1>
    <p class="admin-subtitle">Schweiz zahlt – панель управления</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="admin-flash admin-flash--{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" class="admin-form">
      <label for="password">Пароль</label>
      <input type="password" id="password" name="password" required autofocus>
      <button type="submit" class="admin-btn">Войти</button>
    </form>
  </div>
</body>
</html>
