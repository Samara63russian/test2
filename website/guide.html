<!DOCTYPE html>
<html lang="de-CH" data-lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GuideCH 2026</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;550;650;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="guide-page">
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="./index.html" data-keep-lang>
        <span class="cross" aria-hidden="true"></span>
        <span data-i18n="brand">GuideCH</span>
      </a>
      <nav class="nav">
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang-btn="de">DE</button>
          <button type="button" data-lang-btn="fr">FR</button>
          <button type="button" data-lang-btn="it">IT</button>
        </div>
      </nav>
    </div>
  </header>
  <article class="guide-sheet">
    <p class="kicker" data-i18n="guide.kicker"></p>
    <h1 data-i18n="guide.title"></h1>
    <p class="lead" data-i18n="guide.subtitle"></p>
    <div class="guide-actions">
      <button class="btn" type="button" id="print-guide" data-i18n="guide.print"></button>
      <a class="btn btn-ghost" data-keep-lang href="./index.html#lead" data-i18n="guide.again"></a>
    </div>
    <div id="guide-body"></div>
    <p class="fine" data-i18n="guide.disclaimer"></p>
  </article>
  <script src="./js/i18n.js"></script>
  <script src="./js/app.js"></script>
  <script>
    document.getElementById("print-guide").addEventListener("click", function () {
      window.print();
    });
  </script>
</body>
</html>
